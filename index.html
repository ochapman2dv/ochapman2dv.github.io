<!DOCTYPE html>
<html lang="en">
<head>
    <!-- look at you snooping around -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="icon" type="image/x-icon" href="./media/study.ico">
    <title>The Study Room - Oli's House</title>
</head>
<body>
    <!-- website powered by me running in a big wheel -->
    <h1>Oli's House</h1>
    <noscript><h2>You need javascript to fully enjoy my site's features - or just use the sitemap if you'd prefer :3</h2></noscript>
    <h2 id="tagline">eternally a work in progress, but especially at the moment <3</h2>

    <!-- study -->
    <div id="study" class="main">
        <a id="imac" href="https://macintoshgarden.org/">
            <img src="./media/imac.gif" alt="imac g3" title="puters..."
            onmouseover="this.src='./media/imacHover.gif';"
            onmouseout="this.src='./media/imac.gif';"/>
        </a>
        <a id="rightArrow" onclick="goRoom('lounge')">    
            <img src="./media/arrow.gif" id="rightArrow" title="look right"
            onmouseover="this.src='./media/arrowHover.gif';"
            onmouseout="this.src='./media/arrow.gif';"/>
        </a>
    </div>
    <!-- living room -->
    <div id="lounge" class="main">
        <a id="recordPlayer" href="https://www.youtube.com/watch?v=S61RbaQm6is&list=PLMRtD_292vHKNAzZqhqmTlEpFQMbvX9li">
            <img src="./media/recordPlayer.gif" alt="record player" title="music yay!!"
            onmouseover="this.src='./media/recordPlayerHover.gif';"
            onmouseout="this.src='./media/recordPlayer.gif';"/>
        </a>
        <a id="leftArrow" onclick="goRoom('study')">
            <img src="./media/arrow.gif" id="leftArrow" title="look left"
            onmouseover="this.src='./media/arrowHover.gif';"
            onmouseout="this.src='./media/arrow.gif';"/>
        </a>
    </div>

    <p id="location">You're Currently Visiting: The Study Room</p>
    <h3>made with love by oli,<br>2025 - the end of time</h3>
    <script src="script.js"></script>
</body>
</html>
